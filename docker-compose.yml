name: ai-betting

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-betting}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-betting}"]
      interval: 10s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: ./services/engine
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://app:app@db:5432/betting}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://bet.stav.gr,http://localhost:3000,http://127.0.0.1:18083}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      ODDSPAPI_KEY: ${ODDSPAPI_KEY:-}
      ODDSPAPI_BASE_URL: ${ODDSPAPI_BASE_URL:-https://api.oddspapi.io}
      ODDSPAPI_TIMEOUT_SECONDS: ${ODDSPAPI_TIMEOUT_SECONDS:-20}
      ODDSPAPI_DEFAULT_SPORT_ID: ${ODDSPAPI_DEFAULT_SPORT_ID:-10}
      ODDSPAPI_DEFAULT_BOOKMAKERS: ${ODDSPAPI_DEFAULT_BOOKMAKERS:-pinnacle}
      ODDS_API_IO_KEY: ${ODDS_API_IO_KEY:-}
      ODDS_API_IO_BASE_URL: ${ODDS_API_IO_BASE_URL:-https://api.odds-api.io/v3}
      ODDS_API_IO_TIMEOUT_SECONDS: ${ODDS_API_IO_TIMEOUT_SECONDS:-20}
      ODDS_API_IO_REQUESTS_PER_HOUR: ${ODDS_API_IO_REQUESTS_PER_HOUR:-100}
      ODDS_API_IO_DEFAULT_SPORT: ${ODDS_API_IO_DEFAULT_SPORT:-football}
      ODDS_API_IO_DEFAULT_BOOKMAKERS: ${ODDS_API_IO_DEFAULT_BOOKMAKERS:-Novibet,Stoiximan}
      ODDS_API_IO_DEFAULT_LEAGUE: ${ODDS_API_IO_DEFAULT_LEAGUE:-greece-super-league}
      ODDS_API_IO_EVENT_TTL_SECONDS: ${ODDS_API_IO_EVENT_TTL_SECONDS:-600}
      ODDS_API_IO_ODDS_TTL_SECONDS: ${ODDS_API_IO_ODDS_TTL_SECONDS:-900}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL_NEWS: ${LLM_MODEL_NEWS:-deepseek-chat}
      LLM_MODEL_EXPLAIN: ${LLM_MODEL_EXPLAIN:-deepseek-chat}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ENGINE_PORT:-18084}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      ENGINE_URL: ${ENGINE_URL:-http://engine:8000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://bet.stav.gr}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      engine:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-18083}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
